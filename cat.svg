<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="face">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <!-- white face background -->
    <rect width="64" height="64" fill="#ffffff"/>
    <!-- tuxedo black lower face -->
    <path d="M0 40 L64 40 L64 64 L0 64 Z" fill="#1a1a1a"/>
    <!-- left ear -->
    <path d="M12 14 L26 30 L20 36 L6 30 Z" fill="#1a1a1a"/>
    <!-- right ear -->
    <path d="M52 14 L38 30 L44 36 L58 30 Z" fill="#1a1a1a"/>
    <!-- white muzzle area -->
    <ellipse cx="32" cy="42" rx="18" ry="11" fill="#ffffff"/>
    <!-- left eye -->
    <circle cx="24" cy="29" r="3.2" fill="#1a1a1a"/>
    <circle cx="25" cy="28" r="1.0" fill="#ffffff"/>
    <!-- right eye -->
    <circle cx="40" cy="29" r="3.2" fill="#1a1a1a"/>
    <circle cx="41" cy="28" r="1.0" fill="#ffffff"/>
    <!-- nose -->
    <ellipse cx="32" cy="34" rx="2.4" ry="1.6" fill="#1a1a1a"/>
    <!-- mouth -->
    <path d="M32 35.5 Q28 39 26 38" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M32 35.5 Q36 39 38 38" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <line x1="12" y1="34" x2="22" y2="36" stroke="#1a1a1a" stroke-width="0.6" opacity="0.7"/>
    <line x1="12" y1="38" x2="22" y2="38" stroke="#1a1a1a" stroke-width="0.6" opacity="0.7"/>
    <line x1="42" y1="36" x2="52" y2="34" stroke="#1a1a1a" stroke-width="0.6" opacity="0.7"/>
    <line x1="42" y1="38" x2="52" y2="38" stroke="#1a1a1a" stroke-width="0.6" opacity="0.7"/>
  </g>
</svg>
